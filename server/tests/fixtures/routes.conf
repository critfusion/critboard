# Fleet dispatch routing (Herdr): <label> <herdr-agent-kind> [precheck command]
# A route wakes its agent via bd-wake when an UNCLAIMED ready bead carries the label.
# Pause a route:  touch ~/.overlord/pause/<label>
# Pause the lot:  touch ~/.overlord/pause/ALL
# 'owner' is deliberately absent — those beads wake nobody.
#
# Kind must match `herdr agent list` (codex|grok|cursor|opencode|claude|…).
# Paseo agent IDs are retired; ephemeral Sonnet workers are not available.

# Agent-intent labels (Codex ↔ Grok handoff)
grok-review       grok
needs-grok        grok
needs-codex       codex
needs-cursor      cursor
needs-opencode    opencode
needs-claude      claude

# Testers — re-enable when a matching Herdr pane exists
# android-test      <kind>  adb devices | grep -q '^ABCDE12345[[:space:]]*device'
# web-test          <kind>
